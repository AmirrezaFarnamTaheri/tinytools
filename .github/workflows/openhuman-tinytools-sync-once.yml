name: OpenHuman TinyTools upstream sync (one-shot)
on:
  push:
    branches: [feat/structural-code]
    paths: [.github/workflows/openhuman-tinytools-sync-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Fetch and merge canonical TinyTools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="feat/structural-code"
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo "::error::Branch changed; refusing stale merge"; exit 3; }
          git remote add canonical https://github.com/tinyhumansai/tinytools.git
          git fetch --no-tags canonical +refs/heads/main:refs/remotes/canonical/main
          incoming="$(git rev-parse canonical/main)"
          echo "Canonical TinyTools head: $incoming"
          echo "Merge base: $(git merge-base HEAD "$incoming")"
          mkdir -p merge-audit
          echo "$incoming" > merge-audit/upstream-sha.txt
          if git merge --no-commit --no-ff "$incoming"; then
            # GitHub Actions' token lacks workflows permission; keep the branch's
            # workflow files unchanged and carry upstream CI YAML over through
            # the user-authorized GitHub connector after this content merge.
            git restore --source=HEAD --staged --worktree -- .github/workflows
            git diff --cached --check
            git commit -m "merge: onboard canonical TinyTools main ($incoming)"
            git push origin "HEAD:refs/heads/$branch"
          else
            git diff --name-only --diff-filter=U | tee merge-audit/conflicts.txt
            git diff --cc > merge-audit/combined.diff
            git ls-files -u > merge-audit/stages.txt
            echo "::error::TinyTools conflicts require resolution"
            exit 2
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openhuman-tinytools-merge-audit
          path: merge-audit/
